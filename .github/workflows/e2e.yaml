name: End to End Testing

on:
  issue_comment:
    types: [created]

jobs:
  e2e:
    uses: upbound/uptest/.github/workflows/pr-comment-trigger.yml@c230a80440062d0f70eb03c129ca1fd05636ede4 # main
    with:
      package-type: configuration
    secrets:
      UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
      UPTEST_DATASOURCE: ${{ secrets.UPTEST_DATASOURCE }}
